name: iOS Proof of Life

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-arm64:
    name: Unsigned arm64 IPA
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SDL_VERSION: 2.32.10
      GH_CPU_ARCH: arm64
      GH_CPU_OS: ios
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Record Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install iOS dependencies
        run: |
          brew install glslang
          bash scripts/gha/deps_ios.sh

      - name: Build engine, Half-Life, and Diffusion modules
        run: bash scripts/gha/build_ios.sh

      - name: Verify IPA contract
        run: bash scripts/ios/verify_ipa.sh artifacts/xash3d-fwgs-ios-arm64.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Xash3DiOS-arm64-unsigned
          path: artifacts/xash3d-fwgs-ios-arm64.ipa
          if-no-files-found: error
          retention-days: 14
